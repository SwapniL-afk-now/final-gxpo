data:
  train_batch_size: 256
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: 4  # this is also val batch size
  train_files: ~/data/gsm8k/train.parquet
  val_files: ~/data/gsm8k/test.parquet
  prompt_key: question
  response_key: answer
  max_length: 1024
  truncation: error
  balance_dp_token: False
  chat_template: null
model:
  attn_implementation: flash_attention_2
  partial_pretrain: ~/models/gemma-1.1-7b-it
  model_dtype: fp32
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    strategy: fsdp1
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: False
  trust_remote_code: False
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: all-linear  # Target modules for LoRA adaptation
  use_liger: False
optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  # Offline sparse token-distribution distillation (opt-in for generic SFT).
  kd_enabled: false
  kd_topk: 32
  kd_weight: 0.5
  kd_temperature: 2.0
ulysses_sequence_parallel_size: 1
use_remove_padding: False
trainer:
  default_local_dir: /tmp/sft_model
  default_hdfs_dir: hdfs://tmp/experiments/gsm8k/gemma-1.1-7b-it/ # change the hdfs path here
  resume_path: null
  project_name: gsm8k-sft
  experiment_name: test
  total_epochs: 4
  total_training_steps: null
  logger: ['console']
  seed: 1
  test_freq: 0
  greedy_eval_freq: 0
  save_freq: 0
  resumable_save_freq: 0
  keep_best_only: true
  eval_kind: math
  eval_benchmark_root: null
  eval_greedy_max_new_tokens: 512
  eval_greedy_vllm_gpu_memory_utilization: 0.18
  eval_greedy_vllm_tensor_parallel_size: 1
  eval_greedy_vllm_data_parallel_size: 1
  eval_greedy_vllm_max_num_batched_tokens: 32768
  eval_greedy_vllm_max_num_seqs: 256
